name: Publish BiliCatch

run-name: Publish BiliCatch ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify tag and package versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const expected = process.env.RELEASE_TAG.replace(/^v/, "");
          const versions = {
            "package.json": JSON.parse(fs.readFileSync("package.json", "utf8")).version,
            "package-lock.json": JSON.parse(fs.readFileSync("package-lock.json", "utf8")).packages[""].version,
            "src-tauri/tauri.conf.json": JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
          };

          const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          versions["src-tauri/Cargo.toml"] = cargoToml.match(
            /^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m,
          )?.[1];

          const cargoLock = fs.readFileSync("src-tauri/Cargo.lock", "utf8");
          versions["src-tauri/Cargo.lock"] = cargoLock
            .split("[[package]]")
            .find((section) => /^name = "bilicatch"$/m.test(section))
            ?.match(/^version = "([^"]+)"$/m)?.[1];

          const mismatches = Object.entries(versions).filter(([, version]) => version !== expected);
          if (!expected || mismatches.length > 0) {
            console.error(`Tag version: ${expected || "<empty>"}`);
            for (const [file, version] of Object.entries(versions)) {
              console.error(`${file}: ${version || "<missing>"}`);
            }
            process.exit(1);
          }
          NODE

      - name: Create or refresh draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          release_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          cat > "$RUNNER_TEMP/release-body.md" <<BODY
          Changes:
          - Adds local audio and video transcription powered by whisper.cpp and FireRedASR2.
          - Adds transcription model management, editable results, and TXT/SRT export.
          - Groups transcription models into collapsible series.
          - Falls back through every available media CDN URL before reporting a download failure.
          - Improves task-list navigation and Simplified Chinese transcription output.

          Downloads:
          - Windows x64: [\`BiliCatch_${version}_Windows_x64-setup.exe\`]($release_base/BiliCatch_${version}_Windows_x64-setup.exe)
          - macOS Intel: [\`BiliCatch_${version}_macOS_Intel.dmg\`]($release_base/BiliCatch_${version}_macOS_Intel.dmg) (macOS 11 or later)
          - macOS Apple Silicon: [\`BiliCatch_${version}_macOS_AppleSilicon.dmg\`]($release_base/BiliCatch_${version}_macOS_AppleSilicon.dmg) (macOS 11 or later)

          The Windows installer is not Authenticode-signed. The macOS disk images are not Apple Developer signed or notarized. Only bypass an operating-system warning after verifying that the file came from this repository.

          FFmpeg licensing and source information for the bundled media component is documented in this repository.
          BODY

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" or (.draft and .name == \"BiliCatch $RELEASE_TAG\")) | .id")"
          if [[ -n "$release_id" ]]; then
            is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)"
            if [[ "$is_draft" != "true" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "Release $RELEASE_TAG is already public." >&2
              exit 1
            fi
            if [[ "$is_draft" == "true" ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                --raw-field name="BiliCatch $RELEASE_TAG" \
                --raw-field body="$(<"$RUNNER_TEMP/release-body.md")" \
                --field draft=true \
                --field prerelease=false \
                --silent
            else
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" --silent
              release_id=""
            fi
          fi
          if [[ -z "$release_id" ]]; then
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              --raw-field tag_name="$RELEASE_TAG" \
              --raw-field name="BiliCatch $RELEASE_TAG" \
              --raw-field tag_name="$RELEASE_TAG" \
              --raw-field body="$(<"$RUNNER_TEMP/release-body.md")" \
              --field draft=true \
              --field prerelease=false \
              --jq .id)"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            asset_ids="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].id')"
            while IFS= read -r asset_id; do
              if [[ -n "$asset_id" ]]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" --silent
              fi
            done <<< "$asset_ids"
          else
            for asset_name in ffmpeg-9.0.1.tar.xz lame-3.100.tar.gz; do
              asset_ids="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
                --jq ".[] | select(.name == \"$asset_name\") | .id")"
              while IFS= read -r asset_id; do
                if [[ -n "$asset_id" ]]; then
                  gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" --silent
                fi
              done <<< "$asset_ids"
            done
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build-and-upload:
    needs: prepare-release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset_platform: Windows_x64
            macos_deployment_target: ""
          - runner: macos-15-intel
            platform: macos
            target: x86_64-apple-darwin
            bundles: app,dmg
            asset_platform: macOS_Intel
            macos_deployment_target: "11.0"
          - runner: macos-15
            platform: macos
            target: aarch64-apple-darwin
            bundles: app,dmg
            asset_platform: macOS_AppleSilicon
            macos_deployment_target: "11.0"

    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: ${{ matrix.platform == 'windows' }}

      - name: Verify Windows FFmpeg sidecar
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ffmpegPath = Join-Path $env:GITHUB_WORKSPACE "src-tauri\binaries\ffmpeg-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path -LiteralPath $ffmpegPath -PathType Leaf)) {
            throw "FFmpeg sidecar is missing after checkout."
          }

          $expectedSize = 102856192
          $actualSize = (Get-Item -LiteralPath $ffmpegPath).Length
          if ($actualSize -ne $expectedSize) {
            throw "FFmpeg sidecar size mismatch: expected $expectedSize bytes, got $actualSize bytes."
          }

          $expectedHash = "72A489ECCD008C2EC2C0A5856C5C75BC3D8BBFA90166C4566865C246445E6AA3"
          $actualHash = (Get-FileHash -LiteralPath $ffmpegPath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "FFmpeg sidecar SHA-256 mismatch."
          }

      - name: Verify Windows sherpa-onnx sidecar and FireRedASR2 tokens
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $binaryDirectory = Join-Path $env:GITHUB_WORKSPACE "src-tauri\binaries"
          $sidecar = Join-Path $binaryDirectory "sherpa-onnx-offline-x86_64-pc-windows-msvc.exe"
          $tokens = Join-Path $binaryDirectory "fire-red-asr2-tokens.txt"

          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "sherpa-onnx sidecar is missing after checkout."
          }
          if ((Get-Item -LiteralPath $sidecar).Length -ne 18750976) {
            throw "sherpa-onnx sidecar size mismatch."
          }
          if ((Get-FileHash -LiteralPath $sidecar -Algorithm SHA256).Hash -ne "DE366889E8CF3CDE93121F2D11296749769C8624995030A44B86316F8B0C6779") {
            throw "sherpa-onnx sidecar SHA-256 mismatch."
          }

          if (-not (Test-Path -LiteralPath $tokens -PathType Leaf)) {
            throw "FireRedASR2 token table is missing after checkout."
          }
          $normalizedTokenText = [System.IO.File]::ReadAllText($tokens).Replace("`r`n", "`n")
          $normalizedTokenBytes = [System.Text.Encoding]::UTF8.GetBytes($normalizedTokenText)
          if ($normalizedTokenBytes.Length -ne 79172) {
            throw "FireRedASR2 token table size mismatch."
          }
          $normalizedTokenHash = [Convert]::ToHexString(
            [System.Security.Cryptography.SHA256]::HashData($normalizedTokenBytes)
          )
          if ($normalizedTokenHash -ne "1BC613DE2112D257E61A349C3E72D1B1A9CF19C33D3CA954197AD2171E5EA07B") {
            throw "FireRedASR2 token table SHA-256 mismatch."
          }

          & $sidecar --help *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "sherpa-onnx sidecar smoke test failed."
          }

      - name: Build macOS FFmpeg sidecar
        if: matrix.platform == 'macos'
        shell: bash
        env:
          FFMPEG_VERSION: "9.0.1"
          FFMPEG_SHA256: cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635
          LAME_VERSION: "3.100"
          LAME_SHA256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          build_root="$(mktemp -d "$RUNNER_TEMP/bilicatch-ffmpeg.XXXXXX")"
          prefix="$build_root/prefix"
          ffmpeg_archive="$build_root/ffmpeg-$FFMPEG_VERSION.tar.xz"
          lame_archive="$build_root/lame-$LAME_VERSION.tar.gz"

          curl --fail --location --retry 3 --output "$ffmpeg_archive" \
            "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          curl --fail --location --retry 3 --output "$lame_archive" \
            "https://downloads.sourceforge.net/project/lame/lame/$LAME_VERSION/lame-$LAME_VERSION.tar.gz"
          echo "$FFMPEG_SHA256  $ffmpeg_archive" | shasum -a 256 --check
          echo "$LAME_SHA256  $lame_archive" | shasum -a 256 --check

          if [[ "$TARGET" == "x86_64-apple-darwin" ]] && ! command -v nasm >/dev/null; then
            brew install nasm
          fi

          tar -xzf "$lame_archive" -C "$build_root"
          pushd "$build_root/lame-$LAME_VERSION"
          CFLAGS="-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
            LDFLAGS="-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
            ./configure --prefix="$prefix" --disable-shared --enable-static
          make -j"$(sysctl -n hw.logicalcpu)"
          make install
          popd

          tar -xJf "$ffmpeg_archive" -C "$build_root"
          pushd "$build_root/ffmpeg-$FFMPEG_VERSION"
          PKG_CONFIG_PATH="$prefix/lib/pkgconfig" ./configure \
            --prefix="$prefix" \
            --pkg-config-flags="--static" \
            --extra-cflags="-I$prefix/include -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
            --extra-ldflags="-L$prefix/lib -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
            --disable-autodetect \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-network \
            --disable-shared \
            --enable-static \
            --enable-gpl \
            --enable-version3 \
            --enable-libmp3lame
          make -j"$(sysctl -n hw.logicalcpu)"
          popd

          sidecar="$GITHUB_WORKSPACE/src-tauri/binaries/ffmpeg-$TARGET"
          install -m 755 "$build_root/ffmpeg-$FFMPEG_VERSION/ffmpeg" "$sidecar"

          case "$TARGET" in
            aarch64-apple-darwin) expected_arch="arm64" ;;
            x86_64-apple-darwin) expected_arch="x86_64" ;;
            *) echo "Unsupported macOS target: $TARGET" >&2; exit 1 ;;
          esac
          actual_archs="$(lipo -archs "$sidecar")"
          if [[ "$actual_archs" != "$expected_arch" ]]; then
            echo "FFmpeg architecture mismatch: expected $expected_arch, got $actual_archs" >&2
            exit 1
          fi
          vtool -show-build "$sidecar" | grep -Eq 'minos[[:space:]]+11\.0'

          unexpected_dependencies="$(otool -L "$sidecar" | awk 'NR > 1 { print $1 }' | grep -Ev '^(/usr/lib/|/System/Library/)' || true)"
          if [[ -n "$unexpected_dependencies" ]]; then
            echo "FFmpeg has non-system dynamic dependencies:" >&2
            echo "$unexpected_dependencies" >&2
            exit 1
          fi

          "$sidecar" -hide_banner -encoders | grep -q libmp3lame
          smoke_dir="$build_root/smoke"
          mkdir -p "$smoke_dir"
          "$sidecar" -hide_banner -loglevel error -f lavfi -i "testsrc=size=64x64:rate=10:duration=0.3" \
            -c:v mpeg4 -pix_fmt yuv420p "$smoke_dir/video.mp4"
          "$sidecar" -hide_banner -loglevel error -f lavfi -i "sine=frequency=1000:duration=0.3" \
            -c:a aac "$smoke_dir/audio.m4a"
          "$sidecar" -hide_banner -loglevel error -i "$smoke_dir/video.mp4" -i "$smoke_dir/audio.m4a" \
            -map 0:v:0 -map 1:a:0 -c copy -movflags +faststart "$smoke_dir/muxed.mp4"
          "$sidecar" -hide_banner -loglevel error -i "$smoke_dir/audio.m4a" \
            -c:a libmp3lame -b:a 128k "$smoke_dir/output.mp3"
          test -s "$smoke_dir/muxed.mp4"
          test -s "$smoke_dir/output.mp3"

      - name: Build macOS whisper.cpp sidecar
        if: matrix.platform == 'macos'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          WHISPER_TAG: v1.8.6
          WHISPER_COMMIT: 23ee03506a91ac3d3f0071b40e66a430eebdfa1d
        run: |
          set -euo pipefail

          build_root="$(mktemp -d "$RUNNER_TEMP/bilicatch-whisper.XXXXXX")"
          source_dir="$build_root/whisper.cpp"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C "$source_dir" fetch --depth 1 origin "refs/tags/$WHISPER_TAG"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$WHISPER_COMMIT"

          case "$TARGET" in
            aarch64-apple-darwin) expected_arch="arm64" ;;
            x86_64-apple-darwin) expected_arch="x86_64" ;;
            *) echo "Unsupported macOS target: $TARGET" >&2; exit 1 ;;
          esac

          cmake -S "$source_dir" -B "$build_root/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$expected_arch" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_CURL=OFF
          cmake --build "$build_root/build" --config Release --target whisper-cli \
            -j"$(sysctl -n hw.logicalcpu)"

          sidecar="$GITHUB_WORKSPACE/src-tauri/binaries/whisper-cli-$TARGET"
          install -m 755 "$build_root/build/bin/whisper-cli" "$sidecar"
          actual_archs="$(lipo -archs "$sidecar")"
          if [[ "$actual_archs" != "$expected_arch" ]]; then
            echo "whisper-cli architecture mismatch: expected $expected_arch, got $actual_archs" >&2
            exit 1
          fi
          vtool -show-build "$sidecar" | grep -Eq 'minos[[:space:]]+11\.0'

          unexpected_dependencies="$(otool -L "$sidecar" | awk 'NR > 1 { print $1 }' | grep -Ev '^(/usr/lib/|/System/Library/)' || true)"
          if [[ -n "$unexpected_dependencies" ]]; then
            echo "whisper-cli has non-system dynamic dependencies:" >&2
            echo "$unexpected_dependencies" >&2
            exit 1
          fi
          "$sidecar" --help >/dev/null

      - name: Install macOS sherpa-onnx sidecar
        if: matrix.platform == 'macos'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SHERPA_VERSION: 1.13.8
        run: |
          set -euo pipefail

          case "$TARGET" in
            aarch64-apple-darwin)
              sherpa_arch="arm64"
              expected_arch="arm64"
              archive_sha256="1038a379fff5365b684e05cbbb9ab3577c1a2f6b1736a4d53a6746860d7eddd4"
              ;;
            x86_64-apple-darwin)
              sherpa_arch="x64"
              expected_arch="x86_64"
              archive_sha256="3a6d8782d43de418a22404dd0032ec5ca2e3d049618b43a32100de25c09c392c"
              ;;
            *) echo "Unsupported macOS target: $TARGET" >&2; exit 1 ;;
          esac

          archive_name="sherpa-onnx-v$SHERPA_VERSION-osx-$sherpa_arch-static-no-tts.tar.bz2"
          build_root="$(mktemp -d "$RUNNER_TEMP/bilicatch-sherpa.XXXXXX")"
          archive="$build_root/$archive_name"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$SHERPA_VERSION/$archive_name"
          echo "$archive_sha256  $archive" | shasum -a 256 --check
          tar -xjf "$archive" -C "$build_root"

          source_sidecar="$(find "$build_root" -type f -path '*/bin/sherpa-onnx-offline' -print -quit)"
          if [[ -z "$source_sidecar" ]]; then
            echo "sherpa-onnx-offline was not found in $archive_name." >&2
            exit 1
          fi
          sidecar="$GITHUB_WORKSPACE/src-tauri/binaries/sherpa-onnx-offline-$TARGET"
          install -m 755 "$source_sidecar" "$sidecar"

          actual_archs="$(lipo -archs "$sidecar")"
          if [[ "$actual_archs" != "$expected_arch" ]]; then
            echo "sherpa-onnx architecture mismatch: expected $expected_arch, got $actual_archs" >&2
            exit 1
          fi
          unexpected_dependencies="$(otool -L "$sidecar" | awk 'NR > 1 { print $1 }' | grep -Ev '^(/usr/lib/|/System/Library/)' || true)"
          if [[ -n "$unexpected_dependencies" ]]; then
            echo "sherpa-onnx has non-system dynamic dependencies:" >&2
            echo "$unexpected_dependencies" >&2
            exit 1
          fi
          "$sidecar" --help >/dev/null

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify updater signing secret
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for Tauri updater signatures." >&2
            exit 1
          fi

      - name: Build and upload desktop bundle to draft
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: BiliCatch_[version]_${{ matrix.asset_platform }}[setup][ext]
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Smoke test packaged macOS sidecar
        if: matrix.platform == 'macos'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dmg="$(find "src-tauri/target/$TARGET/release/bundle/dmg" -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No DMG was produced for $TARGET." >&2
            exit 1
          fi

          mount_dir="$(mktemp -d "$RUNNER_TEMP/bilicatch-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null

          app_path="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          bundled_sidecar="$app_path/Contents/MacOS/ffmpeg"
          bundled_whisper="$app_path/Contents/MacOS/whisper-cli"
          bundled_sherpa="$app_path/Contents/MacOS/sherpa-onnx-offline"
          if [[ -z "$app_path" || ! -x "$bundled_sidecar" ]]; then
            echo "The packaged FFmpeg sidecar is missing or not executable." >&2
            exit 1
          fi
          if [[ ! -x "$bundled_whisper" ]]; then
            echo "The packaged whisper-cli sidecar is missing or not executable." >&2
            exit 1
          fi
          if [[ ! -x "$bundled_sherpa" ]]; then
            echo "The packaged sherpa-onnx sidecar is missing or not executable." >&2
            exit 1
          fi

          case "$TARGET" in
            aarch64-apple-darwin) expected_arch="arm64" ;;
            x86_64-apple-darwin) expected_arch="x86_64" ;;
            *) echo "Unsupported macOS target: $TARGET" >&2; exit 1 ;;
          esac
          actual_archs="$(lipo -archs "$bundled_sidecar")"
          if [[ "$actual_archs" != "$expected_arch" ]]; then
            echo "Packaged FFmpeg architecture mismatch: expected $expected_arch, got $actual_archs" >&2
            exit 1
          fi
          whisper_archs="$(lipo -archs "$bundled_whisper")"
          if [[ "$whisper_archs" != "$expected_arch" ]]; then
            echo "Packaged whisper-cli architecture mismatch: expected $expected_arch, got $whisper_archs" >&2
            exit 1
          fi
          sherpa_archs="$(lipo -archs "$bundled_sherpa")"
          if [[ "$sherpa_archs" != "$expected_arch" ]]; then
            echo "Packaged sherpa-onnx architecture mismatch: expected $expected_arch, got $sherpa_archs" >&2
            exit 1
          fi
          vtool -show-build "$bundled_sidecar" | grep -Eq 'minos[[:space:]]+11\.0'
          vtool -show-build "$bundled_whisper" | grep -Eq 'minos[[:space:]]+11\.0'
          "$bundled_whisper" --help >/dev/null
          "$bundled_sherpa" --help >/dev/null

          smoke_dir="$(mktemp -d "$RUNNER_TEMP/bilicatch-packaged-smoke.XXXXXX")"
          "$bundled_sidecar" -hide_banner -loglevel error -f lavfi -i "testsrc=size=64x64:rate=10:duration=0.3" \
            -c:v mpeg4 -pix_fmt yuv420p "$smoke_dir/video.mp4"
          "$bundled_sidecar" -hide_banner -loglevel error -f lavfi -i "sine=frequency=1000:duration=0.3" \
            -c:a aac "$smoke_dir/audio.m4a"
          "$bundled_sidecar" -hide_banner -loglevel error -i "$smoke_dir/video.mp4" -i "$smoke_dir/audio.m4a" \
            -map 0:v:0 -map 1:a:0 -c copy -movflags +faststart "$smoke_dir/muxed.mp4"
          "$bundled_sidecar" -hide_banner -loglevel error -i "$smoke_dir/audio.m4a" \
            -c:a libmp3lame -b:a 128k "$smoke_dir/output.mp3"
          test -s "$smoke_dir/muxed.mp4"
          test -s "$smoke_dir/output.mp3"

          hdiutil detach "$mount_dir" >/dev/null
          rmdir "$mount_dir"
          trap - EXIT

  finalize-release:
    needs:
      - prepare-release
      - build-and-upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Normalize and validate release assets and updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets_file="$RUNNER_TEMP/release-assets.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$assets_file"
          asset_names="$(jq -r '.[].name' "$assets_file")"
          echo "$asset_names"

          require_asset() {
            if ! grep -Eq "$1" <<< "$asset_names"; then
              echo "Missing release asset matching: $1" >&2
              exit 1
            fi
          }

          escaped_version="${version//./\\.}"
          require_asset "^BiliCatch_${escaped_version}_Windows_x64-setup\\.exe$"
          require_asset "^BiliCatch_${escaped_version}_Windows_x64-setup\\.exe\\.sig$"
          require_asset "^BiliCatch_${escaped_version}_macOS_Intel\\.dmg$"
          require_asset "^BiliCatch_${escaped_version}_macOS_AppleSilicon\\.dmg$"
          require_asset "^BiliCatch_${escaped_version}_macOS_Intel\\.app\\.tar\\.gz$"
          require_asset "^BiliCatch_${escaped_version}_macOS_Intel\\.app\\.tar\\.gz\\.sig$"
          require_asset "^BiliCatch_${escaped_version}_macOS_AppleSilicon\\.app\\.tar\\.gz$"
          require_asset "^BiliCatch_${escaped_version}_macOS_AppleSilicon\\.app\\.tar\\.gz\\.sig$"
          require_asset '^latest\.json$'

          if grep -Eq '^(ffmpeg|lame)-' <<< "$asset_names"; then
            echo "Standalone FFmpeg or LAME archives must not be published as release assets." >&2
            exit 1
          fi

          asset_api_url() {
            jq -er --arg pattern "$1" '
              [.[] | select(.name | test($pattern))] |
              if length == 1 then .[0].url else error("expected exactly one matching updater asset") end
            ' "$assets_file"
          }
          export WINDOWS_UPDATE_URL
          export DARWIN_X64_UPDATE_URL
          export DARWIN_ARM64_UPDATE_URL
          release_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          WINDOWS_UPDATE_URL="$release_base/BiliCatch_${version}_Windows_x64-setup.exe"
          DARWIN_X64_UPDATE_URL="$release_base/BiliCatch_${version}_macOS_Intel.app.tar.gz"
          DARWIN_ARM64_UPDATE_URL="$release_base/BiliCatch_${version}_macOS_AppleSilicon.app.tar.gz"

          check_dir="$RUNNER_TEMP/release-check"
          mkdir -p "$check_dir"
          latest_json_url="$(asset_api_url '^latest\.json$')"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$check_dir/latest.json" \
            "$latest_json_url"
          node scripts/rewrite-updater-manifest.mjs \
            "$check_dir/latest.json" \
            "$assets_file" \
            "$GITHUB_REPOSITORY"
          export RELEASE_VERSION="$version"
          jq -e '
            . as $manifest |
            $manifest.version == env.RELEASE_VERSION and
            (["windows-x86_64", "darwin-x86_64", "darwin-aarch64"] | all(
              . as $platform |
              ($manifest.platforms[$platform].signature | type == "string" and length > 0)
            )) and
            $manifest.platforms["windows-x86_64"].url == env.WINDOWS_UPDATE_URL and
            $manifest.platforms["darwin-x86_64"].url == env.DARWIN_X64_UPDATE_URL and
            $manifest.platforms["darwin-aarch64"].url == env.DARWIN_ARM64_UPDATE_URL
          ' "$check_dir/latest.json"

          latest_asset_id="$(jq -er '[.[] | select(.name == "latest.json")] | if length == 1 then .[0].id else error("expected exactly one latest.json asset") end' "$assets_file")"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$latest_asset_id" --silent
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$check_dir/latest.json" \
            --output "$check_dir/uploaded-asset.json" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json"
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$verify_dir"
          uploaded_asset_url="$(jq -er .url "$check_dir/uploaded-asset.json")"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$verify_dir/latest.json" \
            "$uploaded_asset_url"
          cmp "$check_dir/latest.json" "$verify_dir/latest.json"

      - name: Publish validated release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --raw-field tag_name="$RELEASE_TAG" \
            --field draft=false \
            --field prerelease=false \
            --silent
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
